name: Scoped quality checks
on:
  pull_request:
  push:
    branches: [codex/reproducible-lum-shiny]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R_LIBS_USER: ${{ github.workspace }}/.Rlibrary
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev
      - name: Restore pinned R dependencies
        run: Rscript scripts/setup.R
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck && npm run build && git diff --exit-code -- www/busy.js
      - run: Rscript scripts/check.R && Rscript tests/analysis.R
      - name: Install browser test tools
        run: pip install playwright==1.55.0 && python -m playwright install --with-deps chromium
      - name: Live Shiny browser tests
        run: |
          Rscript -e 'shiny::runApp(".", host="127.0.0.1", port=3838, launch.browser=FALSE)' > /tmp/shiny.log 2>&1 &
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:3838/ > /dev/null && break; sleep 1; done
          CHROMIUM=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path)') python tests/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-browser-evidence
          path: |
            docs/design/screens/
            browser-report.json
            /tmp/shiny.log
          retention-days: 7
